trigger:
  branches:
    include:
      - nestjs-migration

pr:
  branches:
    include:
      - nestjs-migration

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '22.x'
  NPM_VERSION: '10.9.8'

  NODE_ENV: test
  MONGO_URL: mongodb://localhost:37017
  MONGO_DB_NAME: spacex_test
  REDIS_URL: redis://localhost:36379
  RABBITMQ_URL: amqp://localhost:35672
  RABBITMQ_QUEUE: spacex-events
  SPACEX_API: http://host/v4
  SPACEX_PROVIDER: mock

steps:

  - checkout: self
    clean: true
    displayName: 'Checkout repository'

  - task: NodeTool@0
    displayName: 'Setup Node.js $(NODE_VERSION)'
    inputs:
      versionSpec: '$(NODE_VERSION)'

  - script: |
      corepack enable

      echo "Node version:"
      node --version

      echo "npm version:"
      corepack npm@$(NPM_VERSION) --version

      echo "Expected npm version:"
      echo "$(NPM_VERSION)"
    displayName: 'Configure and verify Node.js/npm'

  - script: |
      corepack npm@$(NPM_VERSION) ci
    displayName: 'Install dependencies with npm ci'

  - script: |
      docker compose -f docker-compose.test.yml up -d
    displayName: 'Start test infrastructure'

  - script: |
      set -e

      echo "Waiting for MongoDB..."
      timeout 60 bash -c \
        'until docker exec spacex_mongodb_test mongosh --eval "db.adminCommand(\"ping\")" > /dev/null 2>&1; do sleep 2; done'

      echo "MongoDB is ready."

      echo "Waiting for Redis..."
      timeout 60 bash -c \
        'until docker exec spacex_redis_test redis-cli ping | grep -q PONG; do sleep 2; done'

      echo "Redis is ready."

      echo "Waiting for RabbitMQ..."
      timeout 60 bash -c \
        'until docker exec spacex_rabbitmq_test rabbitmq-diagnostics -q ping > /dev/null 2>&1; do sleep 2; done'

      echo "RabbitMQ is ready."

      echo "Test infrastructure is ready."
    displayName: 'Wait for test infrastructure'

  - script: |
      corepack npm@$(NPM_VERSION) run lint
    displayName: 'Lint'

  - script: |
      corepack npm@$(NPM_VERSION) exec -- \
        node -e "console.log({
          NODE_ENV: process.env.NODE_ENV,
          MONGO_URL: process.env.MONGO_URL,
          MONGO_DB_NAME: process.env.MONGO_DB_NAME,
          REDIS_URL: process.env.REDIS_URL,
          RABBITMQ_URL: process.env.RABBITMQ_URL,
          RABBITMQ_QUEUE: process.env.RABBITMQ_QUEUE,
          SPACEX_API: process.env.SPACEX_API,
          SPACEX_PROVIDER: process.env.SPACEX_PROVIDER
        })"
    displayName: 'Check test environment'

  - script: |
      corepack npm@$(NPM_VERSION) run test:gateway -- --runInBand
    displayName: 'Test gateway'

  - script: |
      corepack npm@$(NPM_VERSION) run build
    displayName: 'Build'

  - script: |
      docker compose -f docker-compose.test.yml down -v
    displayName: 'Shutdown test infrastructure'
    condition: always()