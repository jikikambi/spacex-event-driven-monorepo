services:

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command:
      - start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: spacex_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Mgmt UI
    environment:
      RABBITMQ_DEFAULT_USER: spacex
      RABBITMQ_DEFAULT_PASS: spacex
    volumes:
      - spacex_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: spacex_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - spacex_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5    

  mongo:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: Pa55Word
    volumes:
      - spacex_mongo-data:/data/db    

  postgres:
    image: postgres:16-alpine
    container_name: pulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spacexdb
    ports:
      - "5432:5432"
    volumes:
      - spacex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5    

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"     

  gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    image: spacex-gw 
    container_name: spacex_gw 
    ports:
      - "3001:3001"

  ang-app:
    build:
      context: .
      dockerfile: src/ang-app/Dockerfile
    image: spacex-angapp 
    container_name: spacex_angapp   
    ports:
      - "4200:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy 
      redis:
        condition: service_healthy    

  react-app:
    build:
      context: .
      dockerfile: src/react-app/Dockerfile
    image: spacex-reactapp 
    container_name: spacex_reactapp
    ports:
      - "4201:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy 
      redis:
        condition: service_healthy    

  vue-app:
    build:
      context: .
      dockerfile: src/vue-app/Dockerfile
    image: spacex-vueapp 
    container_name: spacex_vueapp   
    ports:
      - "4202:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy 
      redis:
        condition: service_healthy   

volumes:
 spacex_redis_data:      
 spacex_rabbitmq_data: 
 spacex_mongo-data:
 spacex_postgres_data: