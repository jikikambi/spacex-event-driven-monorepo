trigger:
  branches:
    include:
      - nestjs-migration

pr:
  branches:
    include:
      - nestjs-migration

pool:
  name: spacex

variables:
  NODE_VERSION: '22.x'
  NPM_VERSION: '10.9.8'

  NODE_ENV: test
  SPACEX_API: 'http://host/v4'
  SPACEX_PROVIDER: mock

steps:

  # ------------------------------------------------------------
  # Checkout
  # ------------------------------------------------------------

  - checkout: self
    clean: true
    displayName: 'Checkout repository'

  # ------------------------------------------------------------
  # Node.js
  # ------------------------------------------------------------

  - task: NodeTool@0
    displayName: 'Setup Node.js $(NODE_VERSION)'
    inputs:
      versionSpec: '$(NODE_VERSION)'

  - powershell: |
      $ErrorActionPreference = 'Stop'

      Write-Host "Node version:"
      node --version

      Write-Host "Enabling Corepack..."
      corepack enable

      Write-Host "Preparing npm $(NPM_VERSION)..."
      corepack prepare "npm@$(NPM_VERSION)" --activate

      Write-Host "Active npm version:"
      npm --version

      $actual = npm --version
      $expected = "$(NPM_VERSION)"

      if ($actual -ne $expected) {
          throw "Expected npm $expected but found npm $actual."
      }

      Write-Host "Node.js and npm versions are correct."
    workingDirectory: '$(Build.SourcesDirectory)'
    displayName: 'Configure and verify Node.js/npm'

  # ------------------------------------------------------------
  # Dependencies
  # ------------------------------------------------------------

  - powershell: |
      $ErrorActionPreference = 'Stop'

      Write-Host "Installing dependencies with npm ci..."
      npm ci

      Write-Host "Dependencies installed successfully."
    workingDirectory: '$(Build.SourcesDirectory)'
    displayName: 'Install dependencies with npm ci'

  # ------------------------------------------------------------
  # Lint
  # ------------------------------------------------------------

  - powershell: |
      $ErrorActionPreference = 'Stop'

      npm run lint
    workingDirectory: '$(Build.SourcesDirectory)'
    displayName: 'Lint'

  # ------------------------------------------------------------
  # Verify application environment
  # ------------------------------------------------------------

  - powershell: |
      $ErrorActionPreference = 'Stop'

      node -e "console.log({
        NODE_ENV: process.env.NODE_ENV,
        SPACEX_API: process.env.SPACEX_API,
        SPACEX_PROVIDER: process.env.SPACEX_PROVIDER
      })"
    workingDirectory: '$(Build.SourcesDirectory)'
    displayName: 'Check test environment'

  # ------------------------------------------------------------
  # Gateway tests
  # Gateway E2E tests use Testcontainers to create:
  # - MongoDB
  # - Redis
  # - RabbitMQ

  # The tests dynamically obtain the mapped host ports and inject
  # them into process.env before Nest ConfigModule initializes.
  # ------------------------------------------------------------

  - powershell: |
      $ErrorActionPreference = 'Stop'

      npm run test:gateway -- --runInBand
    workingDirectory: '$(Build.SourcesDirectory)'
    displayName: 'Test gateway'

  # ------------------------------------------------------------
  # Build
  # ------------------------------------------------------------

  - powershell: |
      $ErrorActionPreference = 'Stop'

      npm run build
    workingDirectory: '$(Build.SourcesDirectory)'
    displayName: 'Build' 