name: CI

on:
  push:
    branches:
      - nestjs-migration
  pull_request:
    branches:
      - nestjs-migration

jobs:
  gateway-ci:
    name: Gateway CI

    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      SPACEX_API: http://host/v4
      SPACEX_PROVIDER: mock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5      
        with:
          node-version: 22
          cache: npm

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version        

      - name: Install dependencies
        run: npm ci
     
      - name: Lint
        run: npm run lint

      - name: Check test environment
        run: | 
          node -e "console.log({ 
                   NODE_ENV: process.env.NODE_ENV, 
                   SPACEX_API: process.env.SPACEX_API, 
                   SPACEX_PROVIDER: process.env.SPACEX_PROVIDER 
                   })"           

      - name: Test gateway
        run: npm run test:gateway -- --runInBand

      - name: Build
        run: npm run build