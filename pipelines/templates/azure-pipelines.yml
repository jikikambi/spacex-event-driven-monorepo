trigger:
  branches:
    include:
      - nestjs-migration

pr:
  branches:
    include:
      - nestjs-migration

pool:
  name: spacex

variables:
  NODE_VERSION: '22.x'
  NPM_VERSION: '10.9.8'

  NODE_ENV: test
  MONGO_URL: mongodb://localhost:37017
  MONGO_DB_NAME: spacex_test
  REDIS_URL: redis://localhost:36379
  RABBITMQ_URL: amqp://localhost:35672
  RABBITMQ_QUEUE: spacex-events
  SPACEX_API: http://host/v4
  SPACEX_PROVIDER: mock

steps:

  - checkout: self
    clean: true
    displayName: 'Checkout repository'

  - task: NodeTool@0
    displayName: 'Setup Node.js $(NODE_VERSION)'
    inputs:
      versionSpec: '$(NODE_VERSION)'

  - script: |
      corepack enable

      echo "Node version:"
      node --version

      echo "npm version:"
      corepack npm@$(NPM_VERSION) --version

      echo "Expected npm version:"
      echo "$(NPM_VERSION)"
    displayName: 'Configure and verify Node.js/npm'

  - script: |
      corepack npm@$(NPM_VERSION) ci
    displayName: 'Install dependencies with npm ci'

  - script: |
      docker compose -f docker-compose.test.yml up -d
    displayName: 'Start test infrastructure'  

  - powershell: |
      $ErrorActionPreference = 'Stop'

      Write-Host "Waiting for MongoDB..."
      $mongoReady = $false

      for ($i = 0; $i -lt 30; $i++) {
          docker exec spacex_mongodb_test mongosh --eval "db.adminCommand('ping')" 2>$null
          if ($LASTEXITCODE -eq 0) {
              $mongoReady = $true
              break
          }

          Start-Sleep -Seconds 2
        }

      if (-not $mongoReady) {
          throw "MongoDB did not become ready within 60 seconds."
      }

      Write-Host "MongoDB is ready."

      Write-Host "Waiting for Redis..."
      $redisReady = $false

      for ($i = 0; $i -lt 30; $i++) {
          $result = docker exec spacex_redis_test redis-cli ping 2>$null

          if ($LASTEXITCODE -eq 0 -and $result -match 'PONG') {
              $redisReady = $true
              break
          }

          Start-Sleep -Seconds 2
      }

      if (-not $redisReady) {
          throw "Redis did not become ready within 60 seconds."
      }

      Write-Host "Redis is ready."

      Write-Host "Waiting for RabbitMQ..."
      $rabbitReady = $false

      for ($i = 0; $i -lt 30; $i++) {
          docker exec spacex_rabbitmq_test rabbitmq-diagnostics -q ping 2>$null

          if ($LASTEXITCODE -eq 0) {
              $rabbitReady = $true
              break
          }

          Start-Sleep -Seconds 2
      }

      if (-not $rabbitReady) {
          throw "RabbitMQ did not become ready within 60 seconds."
      }

      Write-Host "RabbitMQ is ready."
      Write-Host "Test infrastructure is ready."
    displayName: Wait for test infrastructure  

  - script: |
      corepack npm@$(NPM_VERSION) run lint
    displayName: 'Lint'

  - script: |
      corepack npm@$(NPM_VERSION) exec -- \
        node -e "console.log({
          NODE_ENV: process.env.NODE_ENV,
          MONGO_URL: process.env.MONGO_URL,
          MONGO_DB_NAME: process.env.MONGO_DB_NAME,
          REDIS_URL: process.env.REDIS_URL,
          RABBITMQ_URL: process.env.RABBITMQ_URL,
          RABBITMQ_QUEUE: process.env.RABBITMQ_QUEUE,
          SPACEX_API: process.env.SPACEX_API,
          SPACEX_PROVIDER: process.env.SPACEX_PROVIDER
        })"
    displayName: 'Check test environment'

  - script: |
      corepack npm@$(NPM_VERSION) run test:gateway -- --runInBand
    displayName: 'Test gateway'

  - script: |
      corepack npm@$(NPM_VERSION) run build
    displayName: 'Build'

  - script: |
      docker compose -f docker-compose.test.yml down -v
    displayName: 'Shutdown test infrastructure'
    condition: always()